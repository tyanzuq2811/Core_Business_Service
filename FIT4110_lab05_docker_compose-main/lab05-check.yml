name: Lab 05 - Compose Readiness Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compose-check:
    name: Validate Docker Compose Stack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman, Spectral & HTML reporter
        run: npm install -g @stoplight/spectral-cli newman newman-reporter-htmlextra

      - name: Create .env from example
        run: cp .env.example .env

      - name: Lint OpenAPI contracts
        run: spectral lint contracts/*.yaml

      - name: Lint Docker Compose manifests
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.mock.yml --profile mock config --quiet

      - name: Build and start Compose stack with Mocks
        run: docker compose -f docker-compose.yml -f docker-compose.mock.yml --profile mock up -d --build --wait

      - name: Show running containers
        run: docker compose -f docker-compose.yml -f docker-compose.mock.yml --profile mock ps

      - name: Test Core Business API /health (port 8001)
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS http://localhost:8001/health && exit 0
            echo "Retry $i..."; sleep 5
          done
          docker compose logs api
          exit 1

      - name: Test Mock Services /health (ports 9001..9005)
        run: |
          for port in 9001 9002 9003 9004 9005; do
            curl -fsS "http://localhost:${port}/health" || { docker compose logs; exit 1; }
          done

      - name: Test DB readiness (pg_isready)
        run: |
          set -a; source .env; set +a
          docker compose exec -T db pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"

      - name: Run Newman collection
        run: |
          mkdir -p reports
          newman run postman/collections/FIT4110_lab05_core_business.postman_collection.json \
            -e postman/environments/FIT4110_lab05_local.postman_environment.json \
            -r cli,junit,htmlextra \
            --reporter-junit-export reports/newman-lab05-compose.xml \
            --reporter-htmlextra-export reports/newman-lab05-compose.html

      - name: Verify readiness checklist
        run: |
          CHECKLIST="checklists/readiness-checklist.md"
          if [ ! -f "$CHECKLIST" ]; then
            echo "::error::Thiếu file $CHECKLIST"
            exit 1
          fi
          TOTAL=$(grep -cE '^[[:space:]]*-[[:space:]]*\[[ xX]\]' "$CHECKLIST" || true)
          CHECKED=$(grep -cE '^[[:space:]]*-[[:space:]]*\[[xX]\]' "$CHECKLIST" || true)
          echo "Readiness checklist: ${CHECKED:-0}/${TOTAL:-0} mục đã tick"
          if [ "${CHECKED:-0}" -lt 6 ]; then
            echo "::error::Lab yêu cầu tối thiểu 6 mục readiness, hiện có ${CHECKED:-0}"
            exit 1
          fi

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/
          if-no-files-found: warn

      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.mock.yml --profile mock logs

      - name: Tear down Compose stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.mock.yml --profile mock down -v
