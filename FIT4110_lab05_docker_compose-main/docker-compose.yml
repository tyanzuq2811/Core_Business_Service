# ================================================================
#  Smart Campus Operations Platform — Core Business Stack
# ================================================================
#
#  PORT MAPPING (Host : Container):
#    1. Core Business API   →  8001:8000  (Host 8001, Container 8000)
#    2. PostgreSQL DB       →  5433:5432  (Host 5433, Container 5432)
#
#  CÁC SERVICE ĐỐI TÁC TRONG MẠNG LAN:
#    - AI Vision       : Cấu hình qua AI_VISION_URL trong .env
#    - IoT Ingestion   : Cấu hình qua IOT_SERVICE_URL trong .env
#    - Access Gate     : Cấu hình qua GATE_SERVICE_URL trong .env
#    - Analytics       : Cấu hình qua ANALYTICS_SERVICE_URL trong .env
#    - Notification    : Cấu hình qua NOTIFICATION_SERVICE_URL trong .env
# ================================================================

services:

  # ──────────────────────────────────────────────
  # SERVICE 1: Core Business API (FastAPI)
  # ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartcampus-core-service
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      AI_VISION_URL: ${AI_VISION_URL:-http://192.168.137.1:8000}
      IOT_SERVICE_URL: ${IOT_SERVICE_URL:-http://192.168.137.10:8000}
      GATE_SERVICE_URL: ${GATE_SERVICE_URL:-http://192.168.137.89:8000}
      ANALYTICS_SERVICE_URL: ${ANALYTICS_SERVICE_URL:-http://192.168.137.249:8000}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://192.168.137.40:8000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lab05}:${POSTGRES_PASSWORD:-lab05pass}@db:5432/${POSTGRES_DB:-coredb}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smartcampus-network
    ports:
      - "${HOST_API_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ──────────────────────────────────────────────
  # SERVICE 2: PostgreSQL Database
  # ──────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: smartcampus-core-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lab05}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab05pass}
      POSTGRES_DB: ${POSTGRES_DB:-coredb}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - smartcampus-network
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lab05}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # OPTIONAL MOCK SERVICES (Chỉ bật khi cần giả lập cục bộ)
  # Chạy: docker compose --profile mock up -d
  # ──────────────────────────────────────────────
  ai-vision-mock:
    profiles: ["mock"]
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: smartcampus-ai-mock
    volumes:
      - ./src/ai_service:/service
    networks:
      - smartcampus-network
    ports:
      - "9001:9000"

  iot-mock:
    profiles: ["mock"]
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: smartcampus-iot-mock
    volumes:
      - ./src/iot_mock:/service
    networks:
      - smartcampus-network
    ports:
      - "9002:9000"

  gate-mock:
    profiles: ["mock"]
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: smartcampus-gate-mock
    volumes:
      - ./src/gate_mock:/service
    networks:
      - smartcampus-network
    ports:
      - "9003:9000"

  analytics-mock:
    profiles: ["mock"]
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: smartcampus-analytics-mock
    volumes:
      - ./src/analytics_mock:/service
    networks:
      - smartcampus-network
    ports:
      - "9004:9000"

  notify-mock:
    profiles: ["mock"]
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: smartcampus-notify-mock
    volumes:
      - ./src/notify_mock:/service
    networks:
      - smartcampus-network
    ports:
      - "9005:9000"

# ──────────────────────────────────────────────
# NETWORKS
# ──────────────────────────────────────────────
networks:
  smartcampus-network:
    driver: bridge
    name: smartcampus-network

# ──────────────────────────────────────────────
# VOLUMES
# ──────────────────────────────────────────────
volumes:
  db-data: